name: Rainyun 自动签到

on:
  schedule:
    - cron: '0 2 * * *'  # UTC+8 12点执行
  workflow_dispatch:  # 允许手动触发

jobs:
  sign-in:
    # ubuntu-latest 已切到 26.04，setup-python 的版本清单尚未覆盖该平台，固定用 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          # ddddocr 1.5.6 要求 python < 3.13，取 3.12
          python-version: '3.12'

      - name: 缓存Python依赖
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      - name: 确保temp目录存在
        run: mkdir -p temp

      - name: 执行签到脚本
        run: python rainyun.py
        env:
          # 请在GitHub仓库的Settings > Secrets and variables > Actions中设置这些密钥
          RAINYUN_USER: ${{ secrets.RAINYUN_USER }}
          RAINYUN_PASS: ${{ secrets.RAINYUN_PASS }}
          # 1. Push+ 微信推送
          PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
          PUSH_PLUS_USER: ${{ secrets.PUSH_PLUS_USER }}  # 可选：群组编码

          # 2. SMTP 邮件推送
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_NAME: ${{ secrets.SMTP_NAME }}

          # 3. Bark（iOS 推送）- 可选配置
          BARK_PUSH: ${{ secrets.BARK_PUSH }}  # 设备码或完整 URL

          # 4. 钉钉机器人推送 - 可选配置
          DD_BOT_SECRET: ${{ secrets.DD_BOT_SECRET }}
          DD_BOT_TOKEN: ${{ secrets.DD_BOT_TOKEN }}

          # 5. 飞书机器人推送 - 可选配置
          FSKEY: ${{ secrets.FSKEY }}  # 飞书 Webhook 密钥

          # 6. Telegram 机器人推送 - 可选配置
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}

          # 7. Server 酱推送 - 可选配置
          PUSH_KEY: ${{ secrets.PUSH_KEY }}  # Server 酱密钥（兼容旧版/Turbo版）

          # 设置无头模式环境变量
          HEADLESS: "true"
          # 启用调试日志
          DEBUG: "false"

      - name: 清理临时文件
        run: rm -rf temp
        if: always()  # 即使前面步骤失败也执行清理
